<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Canrisk</title>
    <link rel="stylesheet" href="../../CSS/register.css">
    <link rel="icon" type="image/png" href="../../MULTIMEDIA/Canrisk LOGO.svg">
</head>
<body>
    <!-- LOGIN / REGISTER CARD -->
    <div class="form">
        <!-- Logo and brand -->
        <a class="auth-brand" href="PrincipalING.html">
            <img src="../../MULTIMEDIA/Canrisk LOGO.svg" alt="Canrisk">
            <span>Canrisk</span>
        </a>
        <!-- Form -->
        <form action="">
            <h1>Create your Canrisk account</h1>
            <span class="auth-subtitle">Sign up to unlock all the content</span>

            <div class="field-group">
                <label class="User-text" for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" class="name" required>
            </div>

            <div class="field-group">
                <label class="User-text" for="usuario">User:</label>
                <input type="text" id="usuario" name="usuario" placeholder="Enter your username" class="username" required>
            </div>

            <div class="field-group">
                <label class="User-text" for="contrasena">Password:</label>
                <input type="password" id="contrasena" name="contraseña" placeholder="Enter your password" class="password" required>
            </div>

            <div class="submit-bttn">
                <button type="submit" class="submit-bttn" id="submit-bttn">Create account</button>
            </div>

            <button type="button" class="regresar" onclick="window.history.back()">Go back</button>

            <div class="register">
                <a class="resgis-txt" href="loginING.html">Already have an account?<br>Log in to Canrisk</a>
            </div>
        </form>
    </div>

    <script src="../../JS/register.js"></script>
</body>
</html>
