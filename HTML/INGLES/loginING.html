<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Canrisk</title>
    <link rel="stylesheet" href="../../CSS/register.css">
    <link rel="icon" type="image/png" href="../../MULTIMEDIA/Canrisk LOGO.svg">
</head>
<body>
    <!-- LOGIN / REGISTER CARD  -->
    <div class="form">
        <!-- Logo and brand -->
        <a class="auth-brand" href="PrincipalING.html">
            <img src="../../MULTIMEDIA/Canrisk LOGO.svg" alt="Canrisk">
            <span>Canrisk</span>
        </a>
        <!-- Form -->
        <form action="">
            <h1>Log in to Canrisk</h1>
            <span class="auth-subtitle">Enter your details to continue</span>

            <div class="field-group">
                <label class="User-text" for="usuario">User:</label>
                <input type="text" id="usuario" name="usuario" placeholder="Enter your username" class="username" required>
            </div>

            <div class="field-group">
                <label class="User-text" for="contrasena">Password:</label>
                <input type="password" id="contrasena" name="contraseña" placeholder="Enter your password" class="password" required>
            </div>

            <div class="submit-bttn">
                <button type="submit" class="submit-bttn" id="submit-bttn">Enter!</button>
            </div>

            <button type="button" class="regresar" onclick="window.history.back()">Go back</button>

            <div class="register">
                <a class="resgis-txt" href="registerING.html">Don't have an account?<br>Sign up here</a>
            </div>
        </form>
    </div>

    <script src="../../JS/login.js"></script>
</body>
</html>
